<div class="card">

  <button mat-icon-button [matMenuTriggerFor]="menu" class="menu-icon">
    ⋮
  </button>

  <div class="align">
    <div class="image">
      <img
        src="https://img.freepik.com/free-photo/portrait-white-man-isolated_53876-40306.jpg"
        alt="profile"
      />
    </div>

    <div class="name">
      <h2>{{ employee.employeeName }}</h2>
      <h4>Email: {{ employee.employeeEmail }}</h4>
    </div>
  </div>

  <div class="content">
    <h3>Salary: {{ employee.employeeSalary }}</h3>
    <h3>DOB: {{ employee.employeeDob | date }}</h3>
    <h3>Email: {{ employee.employeeEmail }}</h3>
  </div>

</div>
@if(isEditOpen){
<div  class="edit-box">

  <input [(ngModel)]="editData.employeeName" placeholder="Name" />
  <input [(ngModel)]="editData.employeeEmail" placeholder="Email" />
  <input [(ngModel)]="editData.employeeDob" type="date" />
  <input [(ngModel)]="editData.employeeSalary" type="number" />
    <div class="edit-actions">
      <button (click)="saveEmployee()">Save</button>
      <button (click)="isEditOpen=false">Cancel</button>
    </div>
</div>

}
<mat-menu #menu="matMenu">

  <button mat-menu-item (click)="updateEmployee(employee)">
    Edit
  </button>

  <button mat-menu-item (click)="deleteEmployee(employee.employeeId)">
    Delete
  </button>
</mat-menu>
