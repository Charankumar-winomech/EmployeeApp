<div class="main">
  <button mat-button mat-dialog-close class="close-btn">
    <mat-icon><span class="material-symbols-outlined"> close </span></mat-icon>
  </button>
  <div class="form-div">
    <div class="top">
      <h2>Add Employee</h2>
      <p>User data for the Employee</p>
    </div>
    <div class="form-content">
      <form [formGroup]="data">
        <mat-dialog-content>
          <label>Name</label>
          <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <input
              matInput
              type="text"
              id="name"
              formControlName="name"
              placeholder="Enter a name"
            />
          </mat-form-field>
          @if (form.name.touched && form.name.errors?.['required']) {
            <div class="error">Name is Required</div>
          }
          <label>Salary</label>
          <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <input
              matInput
              type="number"
              id="salary"
              formControlName="salary"
              placeholder="Enter a salary"
              inputmode="numeric"
              pattern="[0-9]*"
            />
          </mat-form-field>
          @if (form.salary.touched && form.salary.errors?.['required']) {
            <div class="error">Salary is Required</div>
          }
          <label>Age</label>
          <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <input
              matInput
              type="number"
              id="age"
              formControlName="age"
              placeholder="Enter a age"
            />
          </mat-form-field>
          @if (form.age.touched && form.age.errors?.['required']) {
            <div class="error">Age is Required</div>
          }
        </mat-dialog-content>
        <mat-dialog-actions>
          <button
            type="submit"
            id="btn"
            [disabled]="data.invalid"
            [mat-dialog-close]="data.value"
            [style.background-color]="data.valid ? 'rgb(19, 18, 24)' : 'rgb(213, 210, 210)'"
          >
            Submit
          </button>
        </mat-dialog-actions>
      </form>
    </div>
  </div>
</div>
