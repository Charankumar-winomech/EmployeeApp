<div class="main">
  <div class="side">
    <div class="top-div">
      <mat-expansion-panel>
        <mat-expansion-panel-header>
          <mat-icon id="dash-icon">
            <span class="material-symbols-outlined"> dashboard_2 </span>
          </mat-icon>
          <mat-panel-title>Dashboard</mat-panel-title>
        </mat-expansion-panel-header>
        <p>Attendance</p>
        <p>Payroll</p>
      </mat-expansion-panel>

      <mat-expansion-panel>
        <mat-expansion-panel-header>
          <mat-icon id="dash-icon">
            <span class="material-symbols-outlined"> account_tree </span>
          </mat-icon>
          <mat-panel-title>Organization</mat-panel-title>
        </mat-expansion-panel-header>
        <p>Roles</p>
        <p>Employee</p>
      </mat-expansion-panel>
    </div>
    <div class="bottom-div">
      <hr id="line" />
      <div class="last">
        <img src="profile.jpg" id="bottom-image" />
        <p>
          {{ userName }}
        </p>
        <mat-icon id="last-btn" (click)="signOut()">
          <span class="material-symbols-outlined"> logout </span>
        </mat-icon>
      </div>
    </div>
  </div>

  <div class="content">
    <app-employeelist />
  </div>
</div>
