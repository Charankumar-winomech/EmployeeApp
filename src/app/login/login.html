<div class="main">
  <div class="div1">
    <div class="Form">
      <h1>Hello,</h1>
      <h1>Welcome Back</h1>
      <p>Hey,welcome back to your special place</p>
      <div class="form-div">
      <form (ngSubmit)="check()">
        <input
          type="text"
          name="username"
          placeholder="Enter a username"
          [(ngModel)]="userName"
          class="inputs"
        />
        <input type="password" name="password" [(ngModel)]="passWord" class="inputs" />
        <div id="forgot">
          <div>
          <input type="checkbox" id="rem" />
          <label for="rem"> Remember me</label>
          </div>
          <div>
          <a href="">Forgot Password?</a>
          </div>
        </div>
        <button type="submit" class="btn">Sign In</button>
      </form>
    </div>
    </div>
  </div>
  <div class="div2">
    <img src="loginimage.avif" alt="no image" />
  </div>
</div>
